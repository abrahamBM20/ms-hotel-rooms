spring.application.name=ms-hotel-rooms

server.port=${PORT:8080}

app.public-host=${PUBLIC_HOST_URL}



logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_RGh4stkX2
app.gateway.secret=${API_GATEWAY_SECRET}

# Supabase: estas variables son obligatorias en el contenedor de producción.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect